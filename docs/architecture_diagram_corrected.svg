<svg viewBox="0 0 1280 750" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <title>MIMS Corrected System Architecture</title>
  <desc>Accurate flow: folder-based document intake, AI-powered OCR, GST bot verification, bot-driven SAP automation through Gate In, MIGO 103, MIGO 105, MIRO, with OCR-failure email alert and audit logging.</desc>

  <rect width="1280" height="750" fill="#ffffff"/>

  <!-- Legend -->
  <g font-size="12" fill="#555">
    <rect x="20" y="15" width="14" height="14" fill="#1c2f4a"/>
    <text x="40" y="26">Start/End</text>
    <rect x="130" y="15" width="14" height="14" fill="#f2a950"/>
    <text x="150" y="26">Manual / Human step</text>
    <rect x="300" y="15" width="14" height="14" fill="#6a4fa0"/>
    <text x="320" y="26">Automated system step</text>
    <rect x="480" y="15" width="14" height="14" fill="#2e7d5b"/>
    <text x="500" y="26">SAP posting (bot)</text>
    <rect x="720" y="15" width="14" height="14" fill="#c0392b"/>
    <text x="740" y="26">Exception / manual review</text>
  </g>

  <!-- Row 1 -->
  <g font-size="13">
    <rect x="20" y="50" width="120" height="55" rx="10" fill="#1c2f4a"/>
    <text x="80" y="83" fill="#fff" text-anchor="middle">START</text>

    <rect x="170" y="50" width="150" height="55" rx="8" fill="#f2a950"/>
    <text x="245" y="72" fill="#222" text-anchor="middle">Vehicle Arrives</text>
    <text x="245" y="89" fill="#222" text-anchor="middle">at Factory Gate</text>

    <rect x="350" y="50" width="180" height="55" rx="8" fill="#f2a950"/>
    <text x="440" y="72" fill="#222" text-anchor="middle">Guard Verifies Physical</text>
    <text x="440" y="89" fill="#222" text-anchor="middle">Docs (Invoice/EWB/LR/Licence)</text>

    <rect x="560" y="50" width="190" height="55" rx="8" fill="#6a4fa0"/>
    <text x="655" y="72" fill="#fff" text-anchor="middle">Docs Scanned &amp; Dropped</text>
    <text x="655" y="89" fill="#fff" text-anchor="middle">into Z:\incoming (folder)</text>

    <rect x="780" y="50" width="200" height="55" rx="8" fill="#6a4fa0"/>
    <text x="880" y="72" fill="#fff" text-anchor="middle">Folder Watcher Groups Files</text>
    <text x="880" y="89" fill="#fff" text-anchor="middle">by filename — needs all 3 docs</text>
  </g>

  <!-- arrows row1 -->
  <g stroke="#888" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="140" y1="77" x2="168" y2="77"/>
    <line x1="320" y1="77" x2="348" y2="77"/>
    <line x1="530" y1="77" x2="558" y2="77"/>
    <line x1="750" y1="77" x2="778" y2="77"/>
  </g>

  <!-- Row 2 -->
  <g font-size="13">
    <rect x="780" y="150" width="200" height="55" rx="8" fill="#6a4fa0"/>
    <text x="880" y="172" fill="#fff" text-anchor="middle">IBM Watsonx AI</text>
    <text x="880" y="189" fill="#fff" text-anchor="middle">OCR &amp; Field Extraction</text>

    <rect x="560" y="150" width="190" height="55" rx="8" fill="#6a4fa0"/>
    <text x="655" y="172" fill="#fff" text-anchor="middle">Extracted Data Saved</text>
    <text x="655" y="189" fill="#fff" text-anchor="middle">to PostgreSQL</text>

    <rect x="350" y="150" width="180" height="55" rx="8" fill="#f2a950"/>
    <text x="440" y="172" fill="#222" text-anchor="middle">User Reviews &amp; Approves</text>
    <text x="440" y="189" fill="#222" text-anchor="middle">(Extracted Data tab)</text>
  </g>
  <g stroke="#888" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="880" y1="105" x2="880" y2="148"/>
    <line x1="780" y1="177" x2="752" y2="177"/>
    <line x1="560" y1="177" x2="532" y2="177"/>
  </g>

  <!-- Row 3 -->
  <g font-size="13">
    <rect x="350" y="250" width="180" height="55" rx="8" fill="#6a4fa0"/>
    <text x="440" y="270" fill="#fff" text-anchor="middle">GST Bots Verify</text>
    <text x="440" y="287" fill="#fff" text-anchor="middle">Seller GSTIN (e-Invoice + Taxpayer)</text>

    <rect x="560" y="250" width="170" height="55" rx="8" fill="#f2a950"/>
    <text x="645" y="270" fill="#222" text-anchor="middle">User Reviews GST</text>
    <text x="645" y="287" fill="#222" text-anchor="middle">Status &amp; Approves</text>

    <rect x="760" y="250" width="200" height="55" rx="8" fill="#2e7d5b"/>
    <text x="860" y="270" fill="#fff" text-anchor="middle">Gate-In Bot Posts ZMMTMN</text>
    <text x="860" y="287" fill="#fff" text-anchor="middle">in SAP</text>
  </g>
  <g stroke="#888" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="440" y1="205" x2="440" y2="248"/>
    <line x1="530" y1="277" x2="558" y2="277"/>
    <line x1="730" y1="277" x2="758" y2="277"/>
  </g>

  <!-- Exception branch (GST invalid) -->
  <g font-size="12">
    <rect x="60" y="250" width="230" height="60" rx="8" fill="#c0392b"/>
    <text x="175" y="272" fill="#fff" text-anchor="middle">GSTIN Invalid / Inactive /</text>
    <text x="175" y="288" fill="#fff" text-anchor="middle">GSTR Not Filed</text>
    <text x="175" y="304" fill="#fff" text-anchor="middle">→ User Holds, No Auto-Email</text>
  </g>
  <g stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowred)" fill="none">
    <line x1="350" y1="270" x2="292" y2="270"/>
  </g>

  <!-- Row 4: MIGO 103 / 105 / MIRO -->
  <g font-size="13">
    <rect x="760" y="350" width="200" height="55" rx="8" fill="#2e7d5b"/>
    <text x="860" y="370" fill="#fff" text-anchor="middle">MIGO 103 — Goods Receipt</text>
    <text x="860" y="387" fill="#fff" text-anchor="middle">into Blocked Stock</text>

    <rect x="760" y="450" width="200" height="55" rx="8" fill="#2e7d5b"/>
    <text x="860" y="470" fill="#fff" text-anchor="middle">MIGO 105 — Transfer to</text>
    <text x="860" y="487" fill="#fff" text-anchor="middle">Unrestricted Stock</text>

    <rect x="760" y="550" width="200" height="55" rx="8" fill="#2e7d5b"/>
    <text x="860" y="570" fill="#fff" text-anchor="middle">MIRO — Invoice Verification</text>
    <text x="860" y="587" fill="#fff" text-anchor="middle">&amp; Vendor Payable Posted</text>
  </g>
  <g stroke="#888" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="860" y1="305" x2="860" y2="348"/>
    <line x1="860" y1="405" x2="860" y2="448"/>
    <line x1="860" y1="505" x2="860" y2="548"/>
  </g>

  <!-- Row 5: Audit + notes -->
  <g font-size="13">
    <rect x="500" y="650" width="220" height="55" rx="8" fill="#6a4fa0"/>
    <text x="610" y="670" fill="#fff" text-anchor="middle">All SAP Doc Numbers &amp;</text>
    <text x="610" y="687" fill="#fff" text-anchor="middle">Timestamps Saved (Audit Trail)</text>

    <rect x="260" y="650" width="200" height="55" rx="10" fill="#1c2f4a"/>
    <text x="360" y="683" fill="#fff" text-anchor="middle">END</text>
  </g>
  <g stroke="#888" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="860" y1="605" x2="860" y2="627" />
    <line x1="860" y1="627" x2="610" y2="627" />
    <line x1="610" y1="627" x2="610" y2="648"/>
    <line x1="500" y1="677" x2="462" y2="677"/>
  </g>

  <!-- OCR failure side branch -->
  <g font-size="12">
    <rect x="1020" y="150" width="220" height="65" rx="8" fill="#c0392b"/>
    <text x="1130" y="172" fill="#fff" text-anchor="middle">OCR Extraction Fails</text>
    <text x="1130" y="188" fill="#fff" text-anchor="middle">→ Group moved to failed/</text>
    <text x="1130" y="204" fill="#fff" text-anchor="middle">→ Email Alert Sent (only email in system)</text>
  </g>
  <g stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowred)" fill="none">
    <line x1="980" y1="177" x2="1018" y2="177"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
